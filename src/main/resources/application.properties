spring.application.name=fpl
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/fpl_db
spring.datasource.username=root
spring.datasource.password=pratham321

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Official FPL HTTP API (no auth for bootstrap-static / event live).
fpl.api.base-url=https://fantasy.premierleague.com/api

# Weekly job: after a gameweek is marked finished + data_checked, refresh players and store that GW's points.
# Default 04:00 UTC Tuesday (adjust fpl.sync.zone for your region).
fpl.sync.scheduler.enabled=true
fpl.sync.cron=0 0 4 * * TUE
fpl.sync.zone=UTC

# Kafka-driven sync (optional). When true, set spring.kafka.bootstrap-servers and run a broker.
# Scheduler and POST /api/sync/* enqueue commands; FplSyncCommandListener performs the work.
fpl.kafka.enabled=false
fpl.kafka.topics.sync-commands=fpl.sync.commands
